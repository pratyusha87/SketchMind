name: CD — Build, Push & Deploy

on:
  push:
    branches: [main]

env:
  REGISTRY: ${{ secrets.DOCKER_HUB_USERNAME }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build & push frontend
        uses: docker/build-push-action@v5
        with:
          context:   ./frontend
          push:      true
          tags: |
            ${{ env.REGISTRY }}/sketchmind-frontend:latest
            ${{ env.REGISTRY }}/sketchmind-frontend:${{ github.sha }}

      - name: Build & push backend
        uses: docker/build-push-action@v5
        with:
          context:   ./backend
          push:      true
          tags: |
            ${{ env.REGISTRY }}/sketchmind-backend:latest
            ${{ env.REGISTRY }}/sketchmind-backend:${{ github.sha }}

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: SSH deploy to server
        uses: appleboy/ssh-action@v1
        with:
          host:     ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key:      ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /opt/sketchmind
            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f
            echo "✦ Deployed at $(date)"
