name: CD — Build, Push & Deploy

on:
  push:
    branches: [main]

env:
  REGISTRY: ${{ secrets.DOCKER_HUB_USERNAME }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build & push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/sketchmind-backend:latest
            ${{ secrets.DOCKER_HUB_USERNAME }}/sketchmind-backend:${{ github.sha }}

      - name: Build & push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/sketchmind-frontend:latest
            ${{ secrets.DOCKER_HUB_USERNAME }}/sketchmind-frontend:${{ github.sha }}

      - name: Deployment note
        run: echo "✦ Images pushed to Docker Hub. App is deployed on Render and Vercel via their own auto-deploy from GitHub."