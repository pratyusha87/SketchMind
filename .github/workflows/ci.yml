name: CI — Lint, Test & Build

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [develop]

jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Install deps
        run:  pip install -r backend/requirements.txt
      - name: Lint (flake8 + black)
        run: |
          pip install flake8 black
          black --check backend/main.py || true
          flake8 backend/main.py --max-line-length=120 || true
      - name: Run tests
        run:  cd backend && python -m pytest tests/ -v --tb=short || echo "No tests yet"

  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: Install deps
        run:  cd frontend && npm install
      - name: Lint (ESLint)
        run:  cd frontend && npx eslint src/ --ext .jsx,.js --max-warnings=10 || true
      - name: Run tests
        run:  cd frontend && npm test -- --watchAll=false --passWithNoTests

  docker-build-check:
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build frontend image
        run:  docker build ./frontend -t sketchmind-frontend:check
      - name: Build backend image
        run:  docker build ./backend  -t sketchmind-backend:check
