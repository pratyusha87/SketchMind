apiVersion: apps/v1
kind: Deployment
metadata:
  name: sketchmind-backend
  labels:
    app: sketchmind-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sketchmind-backend
  template:
    metadata:
      labels:
        app: sketchmind-backend
    spec:
      containers:
        - name: backend
          image: yourdockerhubuser/sketchmind-backend:latest
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:   { name: sketchmind-secrets }
            - configMapRef:{ name: sketchmind-config }
          resources:
            requests: { cpu: "200m", memory: "256Mi" }
            limits:   { cpu: "500m", memory: "512Mi" }
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: sketchmind-backend-svc
spec:
  selector:
    app: sketchmind-backend
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000
  type: ClusterIP
