apiVersion: apps/v1
kind: Deployment
metadata:
  name: sketchmind-frontend
  labels:
    app: sketchmind-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sketchmind-frontend
  template:
    metadata:
      labels:
        app: sketchmind-frontend
    spec:
      containers:
        - name: frontend
          image: yourdockerhubuser/sketchmind-frontend:latest
          ports:
            - containerPort: 80
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits:   { cpu: "300m", memory: "256Mi" }
          livenessProbe:
            httpGet: { path: /, port: 80 }
            initialDelaySeconds: 10
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: sketchmind-frontend-svc
spec:
  selector:
    app: sketchmind-frontend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
  type: LoadBalancer
